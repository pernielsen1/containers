services:
  router_java-deploy:
    build: .
    container_name: router_java-deploy
    network_mode: host
    init: true
    volumes:
      - .:/workspace
    working_dir: /workspace
    command:
      - bash
      - -c
      - |
        set -euo pipefail
        mvn -q -DskipTests package
        java -cp target/router_java.jar com.xv6.simulators.cryptohost.CryptoHostMain --config config/crypto_host.json &
        java -cp target/router_java.jar com.xv6.simulators.downstreamhost.DownstreamHostMain --config config/downstream_host.json &
        java -cp target/router_java.jar com.xv6.router.RouterMain --config config/router_1.json &
        wait
    depends_on: []
