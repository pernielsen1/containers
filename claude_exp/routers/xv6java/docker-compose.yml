services:
  xv6java-deploy:
    build: .
    container_name: xv6java-deploy
    network_mode: host
    init: true
    volumes:
      - .:/workspace
    working_dir: /workspace
    command:
      - bash
      - -c
      - |
        set -euo pipefail
        mvn -q -DskipTests package
        java -cp target/xv6java.jar com.xv6.simulators.cryptohost.CryptoHostMain --config config/crypto_host.json &
        java -cp target/xv6java.jar com.xv6.simulators.downstreamhost.DownstreamHostMain --config config/downstream_host.json &
        java -cp target/xv6java.jar com.xv6.router.RouterMain --config config/router_1.json &
        java -cp target/xv6java.jar com.xv6.simulators.upstreamhost.UpstreamHostMain --config config/upstream_1.json &
        wait
    depends_on: []
